# Applicability Rules
# Decides which systems are required, optional, or not applicable.
# Prevents both over-checking and under-checking.

name: "Applicability Rules"
version: "1.0.0"
schema: applicability-rule

principles:
  - "Required systems must be checked unless blocked by auth or environment."
  - "Optional systems may be checked when evidence suggests they matter."
  - "Not-applicable systems should be ruled out explicitly and explained."

